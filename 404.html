<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pagina non trovata – B&B Arco Gentile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0F4C75;
      color: #FAF8F5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .wrap { max-width: 480px; }
    .num {
      font-family: 'Cormorant Garamond', serif;
      font-size: 8rem;
      font-weight: 300;
      color: #C1674A;
      line-height: 1;
      margin-bottom: 16px;
    }
    h1 { font-family: 'Cormorant Garamond', serif; font-size: 2rem; font-weight: 400; margin-bottom: 16px; }
    p { color: rgba(255,255,255,0.6); margin-bottom: 32px; line-height: 1.7; }
    a {
      display: inline-block;
      padding: 14px 32px;
      background: #C1674A;
      color: #fff;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 500;
      text-decoration: none;
      transition: background 0.3s;
    }
    a:hover { background: #A0503A; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="num">404</div>
    <h1>Pagina non trovata</h1>
    <p>La pagina che stai cercando non esiste o è stata spostata. Torna alla home per scoprire le nostre camere.</p>
    <a href="/">Torna alla Home</a>
  </div>
</body>
</html>
